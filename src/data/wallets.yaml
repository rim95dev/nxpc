# NXPC wallet registry — the source of truth for this page.
#
# Validated against a Zod schema at build time. A malformed address or a missing
# required field fails the build (src/lib/wallets.ts).
#
# ── Why the classification ───────────────────────────────────────────────
# tier   Deduction step. Decides which rung of the ladder an entry goes into.
#   burn      Burned, unrecoverable
#   locked    Locked, undistributed reserve (contribution rewards)
#   vesting   Cliff-locked allocations: IP MG, team, advisors
#   fusion    NXPC Valhalla — reserve that comes in via Fission and goes out via Fusion.
#             Counted as circulating: nothing holds it there. Listed as its own tier
#             so its size stays visible inside the circulating figure.
#   ↑ Everything down to here is an official deduction under the token circulating supply policy.
#     circulating = total issued − burned − contribution reward balance − locked supply
#
#   bridge    Bridge lock. It exists as a wrapped token on another chain, so not deducting it double-counts
#   treasury  Company holdings, revenue and fees
#   wrapper   The portion of wrapper collateral the company holds the claim on
#   ops       Operational hot wallets
#   ecosystem Undistributed ecosystem incentives
#   ↑ Deduct down to here as well and only «supply outside issuer control» is left (the conservative basis).
#
# strictCirculating
#   Whether it counts as circulating under the «issuer control basis». No default is set.
#   Circulating under the «policy basis» is decided by tier, not by this field — the policy
#   deducts only burn·locked·vesting, while fusion·treasury·ecosystem·ops·bridge·wrapper
#   are included in circulating supply because the asset flow table says they «can be circulated at any time».
# share        Used when one address is split into shares (wrapper). Defaults to 1.
# static       An aggregate entry whose address is not published. Not read on-chain; the source is recorded instead.
#
# Sources: the supply definition document (2026-08-29)
#          the token circulating supply policy, v10
# Check balances: node scripts/scan-balances.mjs

# ── Burn ────────────────────────────────────────────────────────────────
- id: burn
  tier: burn
  label: { en: Burned }
  holder: { en: "0x…dEaD" }
  address: "0x000000000000000000000000000000000000dEaD"
  strictCirculating: false

- id: burn-zero
  tier: circulating
  label: { en: Zero address }
  holder: { en: "0x…0000" }
  address: "0x0000000000000000000000000000000000000000"
  # Not an official burn address, so it is not deducted — it counts as circulating.
  strictCirculating: true

